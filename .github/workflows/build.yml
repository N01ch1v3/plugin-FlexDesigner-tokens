name: Build and Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install FlexCLI
        run: npm install -g @eniac/flexcli

      - name: Build plugin
        run: npm run build

      - name: Validate plugin
        run: npm run plugin:validate

      - name: Pack plugin
        run: npm run plugin:pack

      - name: Rename plugin for platform
        shell: bash
        run: |
          set -euo pipefail

          # FlexDesigner expects <uuid>.<os>.<arch>.flexplugin and picks the
          # matching backend automatically at install time.
          case "${{ matrix.os }}" in
            windows-latest) OS_NAME="win32" ;;
            macos-latest)   OS_NAME="darwin" ;;
            ubuntu-latest)  OS_NAME="linux" ;;
            *) echo "::error::Unsupported OS: ${{ matrix.os }}"; exit 1 ;;
          esac

          ARCH=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          SOURCE="com.arishow.aitokens.flexplugin"
          TARGET="com.arishow.aitokens.${OS_NAME}.${ARCH}.flexplugin"

          if [ ! -f "$SOURCE" ]; then
            echo "::error::$SOURCE not found"
            ls -la
            exit 1
          fi

          mv "$SOURCE" "$TARGET"
          echo "Packed $TARGET"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}-${{ runner.arch }}
          path: com.arishow.aitokens.*.*.flexplugin
          compression-level: 0

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.flexplugin
          draft: false
          prerelease: false
          generate_release_notes: true
